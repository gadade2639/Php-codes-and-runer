<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Code Window Terminal Box -->
  <rect x="80" y="100" width="352" height="312" rx="24" fill="#020617" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
  <rect x="80" y="100" width="352" height="48" rx="20" fill="#1e293b"/>
  
  <!-- Terminal Buttons -->
  <circle cx="116" cy="124" r="7" fill="#ef4444"/>
  <circle cx="140" cy="124" r="7" fill="#f59e0b"/>
  <circle cx="164" cy="124" r="7" fill="#10b981"/>

  <!-- Terminal Code Graphics -->
  <!-- PHP & C Symbol -->
  <path d="M140 220 L210 270 L140 320" fill="none" stroke="url(#iconGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="240" y1="320" x2="330" y2="320" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  
  <text x="250" y="240" font-family="monospace" font-weight="bold" font-size="36" fill="#a7f3d0">&lt;PHP/&gt;</text>
  <text x="250" y="280" font-family="monospace" font-weight="bold" font-size="32" fill="#c084fc">C_DS</text>
</svg>
